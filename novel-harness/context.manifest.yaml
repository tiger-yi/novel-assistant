# novel-harness 上下文清单 (Context Manifest)
# 机器可读的规范路由 MAP。AGENTS.md 是人工入口，本文件是路由与加载顺序的唯一事实来源。

schema: novel-harness/context/v2

# 项目快照
project:
  name: Novel Assistant
  type: 玄幻小说结构化创作辅助项目
  root: ".."

# ===== 规范路由 (Spec Routing) =====
# commands: 命令协议 (每次执行命令时读取对应文件)
# specs: 通用规范 (按需读取)
# templates: 初始化与专项报告模板

routes:
  commands:
    - name: init-world
      path: ../writespec/commands/init-world.md
      activation: command
      matches:
        - literal: "初始化世界"
      load: on_command
      pipeline: init-world
      side_effect: write
      writes:
        - ../world/
      requires_confirmation: when_overwriting
    - name: rework-init-world
      path: ../writespec/commands/rework-init-world.md
      activation: command
      matches:
        - literal: "返工初始化世界"
      load: on_command
      pipeline: rework-init-world
      side_effect: write
      writes:
        - ../world/
      requires_confirmation: when_overwriting
    - name: optimize-init-world
      path: ../writespec/commands/optimize-init-world.md
      activation: command
      matches:
        - literal: "优化初始化世界"
      load: on_command
      pipeline: optimize-init-world
      side_effect: write
      writes:
        - ../world/
      requires_confirmation: when_overwriting
    - name: update-world
      path: ../writespec/commands/update-world.md
      activation: command
      matches:
        - literal: "更新世界"
      load: on_command
      pipeline: update-world
      side_effect: write
      writes:
        - ../world/
    - name: revise-arc
      path: ../writespec/commands/revise-arc.md
      activation: command
      matches:
        - pattern: '^修订卷规划\s+(?P<arc>ARC-\d{3})$'
          display: "修订卷规划 ARC-001"
      load: on_command
      pipeline: revise-arc
      side_effect: write
      writes:
        - ../world/outline.md
      requires_confirmation: when_overwriting
    - name: migrate-presentation
      path: ../writespec/commands/migrate-presentation.md
      activation: command
      matches:
        - literal: "迁移正文呈现"
      load: on_command
      pipeline: migration-scan
      side_effect: read_only
    - name: migrate-presentation-chapter
      path: ../writespec/commands/migrate-presentation.md
      activation: command
      matches:
        - pattern: '^迁移正文呈现\s+CH-(?P<chapter>\d{4})$'
          display: "迁移正文呈现 CH-0001"
      load: on_command
      pipeline: migration-chapter
      side_effect: write
      writes:
        - ../chapters/
        - ../world/
      requires_parent_authorization: migrate-presentation
      chapter_target_only: true
    - name: polish-chapter
      path: ../writespec/commands/polish-chapter.md
      activation: command
      matches:
        - pattern: '^润色章节\s+CH-(?P<chapter>\d{4})$'
          display: "润色章节 CH-0001"
          mode: published
      load: on_command
      pipeline: polish-chapter
      side_effect: write
      writes:
        - ../chapters/
        - ../world/chapter-summary.md
      requires_confirmation: when_overwriting
      chapter_target_only: true
      modes:
        published:
          writes:
            - ../chapters/
            - ../world/chapter-summary.md
    - name: polish-current-chapter
      path: ../writespec/commands/polish-chapter.md
      activation: command
      matches:
        - literal: "润色当前章节"
          mode: current-staging
      load: on_command
      pipeline: polish-current-chapter
      side_effect: write
      writes:
        - ../chapters/.staging/
      modes:
        current-staging:
          writes:
            - ../chapters/.staging/
    - name: archive-world
      path: ../writespec/commands/archive-world.md
      activation: command
      matches:
        - literal: "归档世界"
      load: on_command
      pipeline: archive-world
      side_effect: destructive_move
      writes:
        - ../world/
      requires_confirmation: explicit_or_conditional_authorization
    - name: check-status
      path: ../writespec/commands/check-status.md
      activation: command
      matches:
        - literal: "查看世界状态"
      load: on_command
      pipeline: check-status
    - name: cleanup-transactions
      path: ../writespec/commands/cleanup-transactions.md
      activation: command
      matches:
        - literal: "清理事务缓存"
      load: on_command
      pipeline: cleanup-transactions
      side_effect: destructive_local_cache
      requires_confirmation: once_after_preview
    - name: create-chapter
      path: ../writespec/commands/draft-chapter.md
      activation: command
      side_effect: write
      matches:
        - pattern: '^创作第\s*(?P<chapter>\d+)\s*章$'
          display: "创作第 N 章"
          mode: full
        - pattern: '^构思第\s*(?P<chapter>\d+)\s*章$'
          display: "构思第 N 章"
          mode: preview
      load: on_command
      pipeline: create-chapter
      plan_contract: required
      modes:
        preview:
          writes: []
        full:
          writes:
            - ../chapters/
            - ../world/
          single_execution_plan: true
          two_phase_commit: true
          conditional_archive: true
    - name: trending
      path: ../writespec/commands/trending.md
      activation: command
      matches:
        - literal: "热门话题"
      load: on_command
      pipeline: trending
      side_effect: write
      writes:
        - ../analysis/
    - name: create-style
      path: ../writespec/commands/create-style.md
      activation: command
      matches:
        - literal: "创建写作风格"
      load: on_command
      pipeline: create-style
      side_effect: write
      writes:
        - ../writespec/style-guide.md
      invariants:
        - INV-STYLE-001
    - name: audit-originality
      path: ../writespec/commands/audit-originality.md
      activation: command
      matches:
        - literal: "审计原创性"
      load: on_command
      pipeline: audit-originality
      side_effect: read_only
    - name: generate-metadata
      path: ../writespec/commands/generate-metadata.md
      activation: command
      matches:
        - literal: "生成小说元数据"
      load: on_command
      pipeline: generate-metadata
      side_effect: write
      writes:
        - ../metadata/novel-metadata.md
      requires_confirmation: when_overwriting

  specs:
    - name: chapter-creation-spec
      path: ../writespec/chapter-creation-spec.md
      activation: pipeline
      purpose: 单章构思、文本处理、准备提交与门禁
      invariants:
        - INV-CHAPTER-001
        - INV-PLOT-001
    - name: foreshadowing-spec
      path: ../writespec/foreshadowing-spec.md
      activation: pipeline
      purpose: 悬念钩子与伏笔的身份、生命周期、证据和归档语义
      invariants:
        - INV-FORESHADOW-001
    - name: payoff-spec
      path: ../writespec/payoff-spec.md
      activation: pipeline
      purpose: 爽点定义、密度档、规划契约、正文兑现证据和滚动升级门禁
      invariants:
        - INV-PAYOFF-001
    - name: state-management
      path: ../writespec/state-management.md
      activation: pipeline
      purpose: 事实优先级、事务回写、幂等与归档检索
      invariants:
        - INV-TRANSACTION-001
        - INV-STATE-001
    - name: style-guide
      path: ../writespec/style-guide.md
      activation: profile
      purpose: 写作风格指南 (核心调性/排版/去AI化)
    - name: archiving-spec
      path: ../writespec/archiving-spec.md
      activation: pipeline
      purpose: 归档执行规范
      invariants:
        - INV-ARCHIVE-001
    - name: chapter-polish
      path: ../writespec/chapter-polish.md
      activation: pipeline
      purpose: 纯文本润色协议，不包含补字数、审计或回写
    - name: reader-evaluation
      path: ../writespec/reader-evaluation.md
      activation: pipeline
      purpose: 新章 staging 正文的多读者画像评分、阻断和受限重润色证据
    - name: continuous-improvement
      path: ../writespec/continuous-improvement.md
      activation: event
      purpose: IMP 改进提案的触发、验证、人工晋升与规则演进
    - name: world-audit
      path: ../writespec/world-audit.md
      activation: pipeline
      purpose: 六维世界观审计矩阵
      invariants:
        - INV-POWER-001
    - name: world-bible-contract
      path: ../writespec/world-bible-contract.md
      activation: pipeline
      purpose: 八类 World Bible 运行期字段、动作、证据和幂等约束
    - name: originality-audit
      path: ../writespec/originality-audit.md
      activation: pipeline
      purpose: 长篇小说原创性与逻辑审计
    - name: trope-blacklist
      path: ../writespec/trope-blacklist.md
      activation: reference
      purpose: 陈旧桥段黑名单
    - name: metadata-guide
      path: ../writespec/metadata-guide.md
      activation: pipeline
      purpose: 小说元数据生成指南 (由 novel-metadata-generator 技能转写)
  records:
    - name: improvement-log
      path: improvement-log.md
      purpose: IMP 改进提案及其验证、晋升或拒绝结果
      load: on_improvement

# ===== 可执行流程 (Executable Pipelines) =====
pipelines:
  init-world:
    stages:
      - name: preflight
        uses: init-world
        handler: preflight
        required: true
      - name: generate-world
        uses: init-world
        handler: agent
        required: true
      - name: plan-approval
        uses: chapter-creation-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
      - name: payoff-plan
        uses: payoff-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - payoff_plan_evidence
        required_evidence:
          - payoff_plan_evidence
      - name: outline-contract
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
  rework-init-world:
    stages:
      - name: preflight
        uses: rework-init-world
        handler: preflight
        required: true
      - name: rework-audit-baseline
        uses: originality-audit
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - WARN
          - FAIL
      - name: prepare-rework
        uses: rework-init-world
        handler: agent
        required: true
      - name: rework-user-approval
        uses: rework-init-world
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
      - name: longform-readiness
        uses: originality-audit
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - WARN
      - name: payoff-plan
        uses: payoff-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - payoff_plan_evidence
        required_evidence:
          - payoff_plan_evidence
      - name: outline-contract
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
  optimize-init-world:
    stages:
      - name: preflight
        uses: optimize-init-world
        handler: preflight
        required: true
      - name: full-audit
        uses: originality-audit
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - WARN
          - FAIL
      - name: rework-decision
        uses: optimize-init-world
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
      - name: prepare-candidate
        uses: optimize-init-world
        handler: agent
        required: true
      - name: candidate-preview
        uses: optimize-init-world
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
      - name: rework-user-approval
        uses: optimize-init-world
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
      - name: longform-readiness
        uses: originality-audit
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - WARN
      - name: payoff-plan
        uses: payoff-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - payoff_plan_evidence
        required_evidence:
          - payoff_plan_evidence
      - name: outline-contract
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
      - name: full-reaudit
        uses: originality-audit
        handler: semantic-gate
        required: false
        allowed_statuses:
          - PASS
          - WARN
          - FAIL
  create-style:
    stages:
      - name: preflight
        uses: create-style
        handler: preflight
        required: true
      - name: generate-style
        uses: create-style
        handler: agent
        required: true
      - name: longform-style-readiness
        uses: create-style
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - longform_style_readiness
      - name: style-ready
        uses: style-guide
        handler: deterministic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
  create-chapter:
    stages:
      - name: preflight
        uses: state-management
        handler: preflight
        required: true
      - name: first-chapter-readiness
        uses: originality-audit
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - WARN
          - NOT_APPLICABLE
      - name: payoff-plan
        uses: payoff-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - payoff_plan_evidence
        required_evidence:
          - payoff_plan_evidence
      - name: draft
        uses: chapter-creation-spec
        handler: agent
        required: true
      - name: polish
        uses: chapter-polish
        handler: agent
        required: true
      - name: signing-first-impression-risk
        uses: chapter-polish
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
