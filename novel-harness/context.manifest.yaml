        required: true
        allowed_statuses:
          - PASS
        evidence:
          - payoff_fulfillment_evidence
        required_evidence:
          - payoff_fulfillment_evidence
      - name: reader-evaluation
        uses: reader-evaluation
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
          - PASS_WITH_AUTO_FIX
          - PASS_WITH_TARGET_MISS
        delegable: true
        worker: reader-gate-worker
      - name: reader-evaluation-contract
        uses: reader-evaluation
        handler: deterministic-gate
        required: true
      - name: style-application
        uses: style-guide
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - style_application_evidence
      - name: chapter-format
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: narrative-integrity
        uses: chapter-creation-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - chapter_title_uniqueness
          - reported_speech_audit
        required_evidence:
          - reported_speech_audit
      - name: world-audit
        uses: world-audit
        handler: semantic-gate
        required: true
        evidence:
          - six_dimension_world_audit
          - power_balance_evidence
          - world_bible_change_risk
      - name: plot-alignment
