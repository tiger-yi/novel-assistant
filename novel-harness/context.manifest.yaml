        required: true
  update-world:
    stages:
      - name: preflight
        uses: state-management
        handler: preflight
        required: true
      - name: prepare-changes
        uses: update-world
        handler: agent
        required: true
      - name: prepared-change-set
        uses: world-bible-contract
        handler: transaction-gate
        required: true
        allowed_statuses:
          - PASS
      - name: world-audit
        uses: world-audit
        handler: semantic-gate
        required: true
