        handler: semantic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
  archive-world:
    stages:
      - name: preflight
        uses: archiving-spec
        handler: preflight
        required: true
      - name: preview
        uses: archiving-spec
        handler: agent
        required: true
      - name: archive-integrity
        uses: archiving-spec
        handler: semantic-gate
        required: true
      - name: outline-contract
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: commit
        uses: archiving-spec
        handler: transaction-archive
        required: true
  check-status:
    stages:
      - name: render
        uses: state-management
        handler: render
        required: true
  cleanup-transactions:
    stages:
      - name: preview
        uses: cleanup-transactions
        handler: render
        required: true
      - name: confirmation
        uses: cleanup-transactions
        handler: preflight
        required: true
      - name: cleanup
        uses: cleanup-transactions
        handler: local-cache-cleanup
        required: true
  trending:
    stages:
      - name: analyze
        uses: trending
        handler: agent
        required: true
      - name: originality-audit
        uses: originality-audit
        handler: semantic-gate
        required: true
      - name: commit-report
        uses: state-management
        handler: transaction-commit
        required: true
  audit-originality:
    stages:
      - name: audit
        uses: originality-audit
        handler: semantic-gate
        required: true
  generate-metadata:
    stages:
      - name: generate
        uses: metadata-guide
        handler: agent
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true

# ===== Subagent Delegation (Optional) =====
delegation:
  default: disabled
  enable_when:
    - stage_delegable_true
    - explicit_user_request
  max_workers:
    normal_chapter: 3
    arc_terminal_chapter: 4
    read_only_audit: 2
  output_contract:
    artifact_name: evidence artifact
    must_include:
      - task
      - status
      - artifact_path
      - artifact_hash
      - evidence_refs
      - blocking_risks
      - summary
    forbidden_return:
      - full_chapter_text
      - full_world_bible
      - full_archive_excerpt
      - hidden_reasoning
  workers:
    - name: draft-worker
      purpose: 初稿、润色和 staging 正文候选
      may_read: full_repository
      may_write:
        - ../chapters/.staging/
      may_return: evidence_artifact_pointer
    - name: state-worker
      purpose: World Bible 候选文件与变更集
      may_read: full_repository
      may_write:
        - ../world/.staging/
        - ../world/.transactions/
      may_return: evidence_artifact_pointer
    - name: gate-worker
      purpose: 语义门禁证据和结论
      may_read: full_repository
      may_write:
        - ../world/.transactions/
      may_return: evidence_artifact_pointer
    - name: reader-gate-worker
      purpose: 新章 staging 正文的读者画像评分、扣分证据和受限重润色建议
      may_read: full_repository
      may_write:
        - ../world/.transactions/
      may_return: evidence_artifact_pointer
    - name: archive-worker
      purpose: 归档触发、迁移预览和歧义判断
      may_read: full_repository
      may_write:
        - ../world/.staging/
        - ../world/.transactions/
      may_return: evidence_artifact_pointer

# ===== 事务执行 (Transaction Execution) =====
transaction:
  schema: novel-harness/transaction/v1
  record_directory: ../world/.transactions/
  commit_order:
    - ../chapters/
    - ../world/archive/
    - ../world/chapter-summary.md
    - ../world/characters.md
    - ../world/inventory.md
    - ../world/timeline.md
    - ../world/geography.md
    - ../world/power.md
    - ../world/hooks.md
    - ../world/outline.md
    - ../writespec/style-guide.md
    - ../metadata/
    - ../analysis/

# ===== 模板路由 (Template Routing) =====
templates:
  - name: outline
    path: ../templates/outline-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: payoff-evidence
    path: ../templates/payoff-evidence-template.yaml
    used_by: create-chapter
  - name: characters
    path: ../templates/characters-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: timeline
    path: ../templates/timeline-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: geography
    path: ../templates/geography-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: inventory
    path: ../templates/inventory-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: hooks
    path: ../templates/hooks-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: chapter-summary
    path: ../templates/chapter-summary-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: power-system
    path: ../templates/power-system-template.md
    used_by: init-world, rework-init-world, optimize-init-world
  - name: trending-analysis
    path: ../templates/trending-analysis-template.md
    used_by: trending
  - name: transaction-record
    path: ../templates/transaction-record-template.yaml
    used_by: create-chapter, update-world

# ===== 世界数据加载顺序 (World Data Loading Order) =====
# 构思/创作章节前，按此顺序加载 World Bible 上下文。
world_data:
  default_order:
    - ../world/outline.md           # 主线大纲 (必须)
    - ../world/chapter-summary.md   # 章节摘要承接 (必须)
    - ../world/characters.md        # 人物状态 (必须)
    - ../world/hooks.md             # 叙事线索注册表 (必须)
    - ../writespec/style-guide.md   # 风格对齐 (写作阶段)
    - ../world/power.md             # 力量体系 (战斗场景按需)
    - ../world/inventory.md         # 道具库存 (战斗/消耗按需)
    - ../world/timeline.md          # 时间线 (时序按需)
    - ../world/geography.md         # 地理势力 (环境按需)
  required:
    - ../world/outline.md
    - ../world/chapter-summary.md
    - ../world/characters.md
    - ../world/hooks.md
    - ../world/power.md
    - ../world/inventory.md
    - ../world/timeline.md
    - ../world/geography.md
  profiles:
    preview:
      - ../world/outline.md
      - ../world/chapter-summary.md
      - ../world/characters.md
      - ../world/hooks.md
    drafting:
      - ../world/outline.md
      - ../world/chapter-summary.md
      - ../world/characters.md
      - ../world/hooks.md
      - ../writespec/style-guide.md
    full-audit:
      - ../world/outline.md
      - ../world/chapter-summary.md
      - ../world/characters.md
      - ../world/hooks.md
      - ../world/power.md
      - ../world/inventory.md
      - ../world/timeline.md
      - ../world/geography.md

# ===== 技能路由 (Skill Routing) =====
# 说明: 原 .trae/skills 技能已转化为 writespec/ 下的规范，不再以独立技能形式保留。
skills:
  - name: chapter-polisher
    status: converted
    target: ../writespec/chapter-polish.md
  - name: novel-originality-auditor
    status: converted
    target: ../writespec/originality-audit.md
  - name: novel-metadata-generator
    status: converted
    target: ../writespec/metadata-guide.md

# ===== 验证命令 (Verification Commands) =====
verification:
  preflight_gates:
    - name: style-ready
      description: 写作风格 frontmatter 状态为 ready、必需章节齐全；完整章节创作另校验 style_basis 书名锚点
      command: python scripts/validate_harness.py --style-guide <style_file>
      invariant: INV-STYLE-001
    - name: world-completeness
      description: 八类 World Bible 齐全且目标章节号无冲突
  commands:
    - name: harness-integrity
      description: 校验 Manifest、AGENTS、README、风格就绪状态与文件路由一致性
      command: python scripts/validate_harness.py
    - name: chapter-length
      description: 章节字数检查 (2300-2800字)
      command: python scripts/check_count.py <chapter_file> --target 2300 --max 2800 --segments
    - name: chapter-format
      description: 校验章节字数、禁用符号、Markdown 与风格黑名单
      command: python scripts/validate_chapter.py <chapter_file> --target 2300 --max 2800
      invariant: INV-CHAPTER-001
    - name: outline-contract
      description: 校验卷路线图、固定章节区间、卷目标、里程碑与章节执行契约
      command: python scripts/validate_outline.py <outline_file>
      invariant: INV-PLOT-001
    - name: payoff-contract
      description: 校验爽点证据的密度、类型轮换、事件去重、升级与滚动高潮
      command: python scripts/validate_payoff.py <payoff_evidence_file>
      invariant: INV-PAYOFF-001
    - name: reader-evaluation-contract
      description: 校验读者评价高分反证、比较依据和改进方向
      command: python scripts/validate_reader_evaluation.py <reader_evaluation_file>
  semantic_gates:
    - name: source-baseline
      spec: ../writespec/commands/polish-chapter.md
      evidence_required: true
    - name: presentation-baseline
      spec: ../writespec/commands/polish-chapter.md
      evidence_required: true
    - name: presentation-scan
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
    - name: presentation-equivalence
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
    - name: narrative-integrity
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
      required_evidence:
        - reported_speech_audit
      invariant: INV-CHAPTER-001
    - name: plot-alignment
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
      invariant: INV-PLOT-001
    - name: plan-impact
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
    - name: plan-approval
      spec: ../writespec/chapter-creation-spec.md
      evidence_required: true
    - name: payoff-plan
      spec: ../writespec/payoff-spec.md
      evidence_required: true
      required_evidence:
        - payoff_plan_evidence
      invariant: INV-PAYOFF-001
    - name: payoff-fulfillment
      spec: ../writespec/payoff-spec.md
      evidence_required: true
      required_evidence:
        - payoff_fulfillment_evidence
      invariant: INV-PAYOFF-001
    - name: rework-audit-baseline
      spec: ../writespec/originality-audit.md
      evidence_required: true
    - name: rework-user-approval
      spec: ../writespec/commands/rework-init-world.md
      evidence_required: true
    - name: rework-decision
      spec: ../writespec/commands/optimize-init-world.md
      evidence_required: true
    - name: candidate-preview
      spec: ../writespec/commands/optimize-init-world.md
      evidence_required: true
    - name: longform-readiness
      spec: ../writespec/originality-audit.md
      evidence_required: true
    - name: first-chapter-readiness
      spec: ../writespec/originality-audit.md
      evidence_required: true
    - name: world-audit
      spec: ../writespec/world-audit.md
      evidence_required: true
      invariant: INV-POWER-001
    - name: reader-evaluation
      spec: ../writespec/reader-evaluation.md
      evidence_required: true
    - name: signing-first-impression-risk
      spec: ../writespec/chapter-polish.md
      evidence_required: true
    - name: longform-style-readiness
      spec: ../writespec/commands/create-style.md
      evidence_required: true
    - name: style-application
      spec: ../writespec/style-guide.md
      evidence_required: true
    - name: logic-closure
      spec: ../writespec/state-management.md
      evidence_required: true
    - name: narrative-thread-integrity
      spec: ../writespec/foreshadowing-spec.md
      evidence_required: true
      invariant: INV-FORESHADOW-001
    - name: periodic-trigger-classification
      spec: ../writespec/originality-audit.md
      evidence_required: true
    - name: archive-integrity
      spec: ../writespec/archiving-spec.md
      evidence_required: true
      invariant: INV-ARCHIVE-001
  transaction_gates:
    - name: prepared-change-set
      description: 发布前生成无冲突的 World Bible 变更集
      evidence_required: true
      invariant: INV-TRANSACTION-001
    - name: postflight-consistency
      description: 校验正式正文、YAML 事务记录、World Bible 引用与幂等键
      evidence_required: true
      invariant: INV-STATE-001
  periodic_gates:
    - name: originality-cycle
      pipeline: audit-originality
      interval_chapters: 10
      triggers:
        - outline_initialized
        - arc_completed
        - premise_changed
      blocks_next_cycle: true

# ===== 归档目录 (Archive) =====
archive:
  - name: outline-history
    path: ../world/archive/outline_history.md
  - name: characters-registry
    path: ../world/archive/characters_registry.md
  - name: timeline-chronicles
    path: ../world/archive/timeline_chronicles.md
  - name: inventory-logs
    path: ../world/archive/inventory_logs.md
  - name: world-atlas
    path: ../world/archive/world_atlas.md
  - name: hooks-history
    path: ../world/archive/hooks_history.md
  - name: chapter-summary-history
    path: ../world/archive/chapter_summary_history.md

# ===== 加载策略 (Loading Policy) =====
loading_policy:
  default_order:
    - "读取 AGENTS.md 确认项目规则"
    - "读取 context.manifest.yaml 获取路由"
    - "按命令路由读取对应命令协议 (commands/*)"
    - "按需读取规范 (specs/*) 与模板 (templates/*)"
    - "按任务模式加载 world_data.profiles；无匹配项时才使用默认顺序"
    - "命中归档索引、历史实体或跨卷因果时按 state-management 最小回溯"
    - "验证阶段执行 verification.commands"
  lazy_load: true
  scope_must_be_explicit: true
