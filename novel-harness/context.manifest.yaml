      - name: presentation-equivalence
        uses: chapter-creation-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        delegable: true
        worker: gate-worker
      - name: style-application
        uses: style-guide
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        delegable: true
        worker: gate-worker
        evidence:
          - style_application_evidence
      - name: narrative-integrity
        uses: chapter-creation-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        evidence:
          - reported_speech_audit
        required_evidence:
          - reported_speech_audit
        delegable: true
        worker: gate-worker
      - name: world-audit
        uses: world-audit
        handler: semantic-gate
        required: true
        delegable: true
        worker: gate-worker
        evidence:
          - six_dimension_world_audit
          - power_balance_evidence
          - world_bible_change_risk
      - name: thread-integrity
        uses: foreshadowing-spec
        handler: semantic-gate
        required: true
        allowed_statuses:
          - PASS
        delegable: true
        worker: gate-worker
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
  polish-current-chapter:
    stages:
      - name: staging-preflight
        uses: polish-chapter
        handler: preflight
        required: true
      - name: polish
        uses: chapter-polish
        handler: agent
        required: true
        delegable: true
        worker: draft-worker
      - name: signing-first-impression-risk
        uses: chapter-polish
        handler: semantic-gate
        required: true
