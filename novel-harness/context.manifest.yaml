          - PASS
        evidence:
          - narrative_thread_handling_table
          - active_thread_due_audit
          - candidate_thread_rationale
          - foreshadowing_change_set_evidence
        required_evidence:
          - narrative_thread_handling_table
          - active_thread_due_audit
          - candidate_thread_rationale
          - foreshadowing_change_set_evidence
      - name: periodic-trigger-classification
        uses: originality-audit
        handler: semantic-gate
        required: true
      - name: archive-integrity
        uses: archiving-spec
        handler: semantic-gate
        required: true
      - name: outline-contract
        uses: chapter-creation-spec
        handler: deterministic-gate
        required: true
      - name: commit
        uses: state-management
        handler: transaction-commit
        required: true
      - name: conditional-archive
        uses: archiving-spec
        handler: transaction-archive
        required: false
  polish-chapter:
    stages:
      - name: source-baseline
        uses: polish-chapter
        handler: semantic-gate
        required: true
        allowed_statuses:
