# 主角配置 (Protagonist Spec)
[main_character]
name = "张启明"
identity = "龙虎山第101代天师 / 荒村幸存者"
realm = "2阶: 熔脉境 (极境/九天雷脉) / 3阶: 出神 (初期/神识化灵)"
affiliation = "龙虎山 (前世) / 散修"
personality = "杀伐果断、理智至极、护短、有正气但不圣母"
status = "第66章：进入归虚之门，在归墟廊桥遭遇神魂吞噬者。强行开启‘阴阳磨盘’炼化神魂黑影，完成神识化灵，晋升出神境初期。随后以阳平印位格唤醒廊桥万灯。状态：脏腑重伤未愈，灵力几乎枯竭（约1%），阳平印灵性显著消耗（需充能）；神魂旧伤趋稳，可短时外放神识。"
status = "第66章：进入归虚之门，在归墟廊桥遭遇神魂吞噬者。强行开启‘阴阳磨盘’炼化神魂黑影，完成神识化灵，晋升出神境初期。随后以阳平印位格唤醒廊桥万灯。状态：脏腑重伤未愈，灵力几乎枯竭（约1%），阳平印灵性显著消耗（需充能）；神魂旧伤趋稳，可短时外放神识。第67章：于归墟传承殿启开青铜匣室得‘道种’（封存/未觉醒），脏腑疼痛短期加重；阳平印仍处静默期；神识外放需谨慎。"
status = "第68章：借钟律引出一缕‘太一雷浆’，以月白绸缎为载导入雷骨与脏腑破损处；在归墟传承殿承受三组劫火重压（九声/三组），未强炼道种，仅行润泽。状态：神识稳定度提升（出神初期更稳），旧伤由撕裂降为钝痛，行动力提升约20%；阳平印仍处静默期，需后续充能。"
status = "第69章：归墟廊桥尽头试探钟残，与灯海亮度短升后回落；影壁涂抹因果层剥落，显露修复序列‘印、钟、浆、种’。状态：神识稳态小幅提升；行动力稳；阳平印仍静默需后续充能；太一雷浆仍入骨封存。"
status = "第70章：自归墟归来于天水关外设‘序’，夜入某郡祭坛，以青蓝水雷润后微切，崩护祭执事骨甲；以月白绸缎作载体配合井扣钟律执行位格转嫁，剪断郡城与京师锁龙井的供给因果。状态：出神初期稳态；行动力小幅提升；未强唤阳平印（仍静默需充能）；太一雷浆仍入骨封存。"

