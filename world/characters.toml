# [ReAct Protocol: Characters]

# 主角配置 (Protagonist Spec)
[main_character]
name = "张启明"
identity = "龙虎山第101代天师 / 荒村幸存者"
realm = "2阶: 熔脉境 (极境/九天雷脉) / 1阶: 存思 (法相睁眼)"
affiliation = "龙虎山 (前世) / 散修"
personality = "杀伐果断、理智至极、护短、有正气但不圣母"
status = "正在城主府赴宴，以白骨医馆信物伪装身份，震慑守卫，即将直面城主李文正。"

[[main_character.skills]]
name = "尸解灵机 (残)"
grade = "规则级 (极阴/正统残余)"
mastery = "初获 (封印于右手)"
description = "第34章从‘道门孽徒’残留执念中强行撕扯下的灵机。蕴含道门正统异化后的规则优先权，虽阴冷刺骨，却能与九天雷罡形成奇妙的‘阴阳磨盘’，是修复右手及未来冲击更高位格的关键。"

[[main_character.skills]]
name = "九天雷脉"
grade = "道门根基 (极境/熔脉)"
mastery = "初成 (经脉雷霆化)"
description = "吞噬‘地脉雷髓’后强行熔铸而成的霸道经脉。灵力流转速度提升十倍，自带雷霆震慑与净化效果，可瞬间爆发数倍于同阶的战力，且对诡道位格具有天然的撕裂感。"

[[main_character.skills]]
name = "紫电雷骨"
grade = "道门根基 (极境)"
mastery = "大成 (全身已成)"
description = "以阳燧真火、乙木灵机与虎符兵煞三重锻打而成的至阳骨骼。骨骼紫玉化，内蕴雷纹，举手投足间自带雷鸣，可承载高阶雷法，且对低位格诡异具有绝对震慑力。"

[[main_character.skills]]
name = "雷种 (已引爆)"
grade = "道门至宝 (压缩雷罡)"
mastery = "已消耗"
description = "已于第20章引爆，摧毁活死人墓及其中邪祟。"

[[main_character.skills]]
name = "道门法铃"
grade = "道门法器 (2阶)"
mastery = "初窥门径 (已觉醒‘位格剥离’与‘雷音镇煞’)"
description = "第20章夺取的神秘铃铛，具备镇压煞位、清心、位格优先权。第23章在长生观地宫内强行剥离金面具人印信本源，展现出对低位格诡异力量的绝对统治力。"

[[main_character.skills]]
name = "九阴绝户阵 (反转应用)"
grade = "诡道/风水"
mastery = "入门"
description = "利用极阴之地气建立死局。张启明通过雷种将其转化为‘雷火炼狱’，实现死中求生。"

[main_character.attributes]
physique = "雷骨初胚 (右臂进化)。右臂呈现冷玉质感，皮下隐约可见密密麻麻的雷纹与金线交织，具备极强的物理爆发力与雷罡传导率。全身经脉因暗金能量填补而愈发坚韧。"
soul = "天师法魂 (神魂借雷阵灵机复苏，法相已能睁眼进行小规模位格压制。)"

[[main_character.skills]]
name = "小五雷聚灵阵 (临时)"
grade = "道门阵法"
mastery = "入门"
description = "利用雷法位格过滤污秽灵机，化诡异为清凉灵机。第15章中首次布阵成功。"

[[main_character.skills]]
name = "大武横练 (基础)"
grade = "黄级"
mastery = "入门"

[[main_character.skills]]
name = "九天应元雷声普化天尊观想图"
grade = "神话位格"
mastery = "1阶: 存思"
description = "镇守灵台，万邪不侵，雷霆之威对诡异有绝对压制。已开启【静心】能力，免疫基础诡异低语。"

[[main_character.skills]]
name = "龙虎山五雷正法 (残)"
grade = "道门至宝"
mastery = "入门 (威力因世界法则限制严重削弱)"
description = "已掌握初步运用技巧：崩劲（透体杀伤）、尸爆（引爆尸体内血气与雷力造成范围伤害）。"

