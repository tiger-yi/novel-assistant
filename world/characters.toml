[main_character.attributes]
physique = "雷骨(重塑)。原本受损的雷骨在第50章吞噬‘雷髓’后完成缝合，左腿煞气彻底清除，整体强度更甚以往。但在第47章强行引动地脉伟力导致肉身遭受毁灭性反噬，脏腑受损严重，常伴随内脏碎片咳出。第59章虽经雷罡压制，但因强行爆发本源雷力，伤势有恶化迹象，每行一步皆如万针攒刺。"
soul = "天师法魂 (法相睁眼)。第66章完成‘神识化灵’，可在极度虚弱状态下短时外放神识，游神百丈并施加位格威压；识海旧伤趋稳，但需避免长时间外放以防本源耗损。"

